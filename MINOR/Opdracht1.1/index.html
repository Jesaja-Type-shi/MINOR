<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Document</title>
  <link href="index.css">
  <!-- A-Frame library, geladen via jsdelivr -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
</head>
<body>

  <div id="hint">Sleep met je muis (of beweeg je telefoon) om rond te kijken</div>

  <a-scene>

    <!-- Assets: hier zetten we straks onze zelfgemaakte 360°-afbeelding in -->
    <a-assets>
      <img id="sky-texture" crossorigin="anonymous">
    </a-assets>

    <!-- De 360°-omgeving: een bol die van binnenuit bekeken wordt -->
    <a-sky id="sky" src="#sky-texture" rotation="0 -130 0"></a-sky>

    <!-- Zwevende tekst, met een simpele animatie zodat hij op en neer beweegt -->
    <a-entity position="0 1.6 -3">
      <a-text
        value="Hello, VR World!"
        align="center"
        color="#FFFFFF"
        width="6"
        animation="property: position; to: 0 0.3 0; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine">
      </a-text>
    </a-entity>

    <!-- Camera die meebeweegt met muis / telefoonsensoren -->
    <a-entity camera look-controls position="0 1.6 0"></a-entity>

  </a-scene>


</body>
<script src="index.js"></script>
</html>
