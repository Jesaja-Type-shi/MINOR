<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strandscene</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>
<body>
<audio id="shellAudio" src="../strandaudiobitv.mp3" preload="auto"></audio>
<a-scene>
    <a-sky color="#78c8f5"></a-sky>
    <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="100"
        height="100"
        color="#f4d35e">
    </a-plane>
    <a-sphere
        id="schelp"
        class="clickable"
        position="0 0.55 2"
        radius="0.45"
        color="#f8deb3"
        onclick="playShellSound()"
        animation="property: position; from: 0 0.55 2; to: 0 0.85 2; dir: alternate; dur: 1200; loop: true; easing: easeInOutSine">
    </a-sphere>
    <a-entity position="0 1.6 6">
        <a-camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-camera>
    </a-entity>
</a-scene>

<script>
    function playShellSound() {
        const shellAudio = document.getElementById("shellAudio");
        shellAudio.currentTime = 0;
        shellAudio.play();
    }
</script>
</body>
</html>
