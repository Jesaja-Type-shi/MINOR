<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strandscene</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>
<body>
<audio id="shellAudio" src="../strandaudiobitv.mp3" preload="auto"></audio>
<a-scene>
    <a-assets>
        <a-asset-item id="zon" src="/MINOR/zon.glb"></a-asset-item>
        <a-asset-item id="ladder" src="/MINOR/GLB format/ladder.glb"></a-asset-item>
        <a-asset-item id="gate" src="/MINOR/GLB format/gate.glb"></a-asset-item>
    </a-assets>

    <a-sky src="/MINOR/Skyboxes/skybox-day.png"></a-sky>
    <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="100"
        height="100"
        color="#f2d58a">
    </a-plane>

    <a-plane
        position="0 0.03 -30"
        rotation="-90 0 0"
        width="100"
        height="40"
        color="#28b8d8">
    </a-plane>
    <a-plane
        position="0 0.04 -9.8"
        rotation="-90 0 0"
        width="100"
        height="0.7"
        color="#fff8e7"
        opacity="0.85">
    </a-plane>

    <a-light type="ambient" intensity="1.2" color="#fff8e8"></a-light>
    <a-entity position="0 12 -25">
        <a-light type="point" intensity="2.5" distance="100" color="#fff1bd"></a-light>
        <a-light type="directional" intensity="1.2" color="#fff4cf"></a-light>
        <a-entity gltf-model="#zon" scale="2.2 2.2 2.2"></a-entity>
    </a-entity>

    <a-entity gltf-model="#ladder" position="0 -0.29094 -3" scale="0.5 0.5 0.5" rotation="40 0 45"></a-entity>
    <a-entity gltf-model="#gate" position="-2 0 -5" scale="0.8 0.8 0.8"></a-entity>

    <a-sphere
        id="schelp"
        class="clickable"
        position="0 0.55 2"
        radius="0.45"
        color="#f8deb3"
        onclick="playShellSound()"
        animation="property: position; from: 0 0.55 2; to: 0 0.85 2; dir: alternate; dur: 1200; loop: true; easing: easeInOutSine">
    </a-sphere>

    <a-camera position="0 1.6 8" wasd-controls look-controls cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-camera>
</a-scene>
<script>
    function playShellSound() {
        const shellAudio = document.getElementById("shellAudio");
        shellAudio.currentTime = 0;
        shellAudio.play();
    }
</script>
</body>
</html>
